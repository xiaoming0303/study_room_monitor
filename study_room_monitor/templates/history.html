<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>历史数据 - 书房温湿度监控</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; max-width: 900px; margin: 30px auto; padding: 0 20px; }
        h1 { text-align: center; }
        nav { text-align: center; margin-bottom: 15px; }
        nav a { margin: 0 15px; color: #333; }
        img { width: 100%; border: 1px solid #ddd; border-radius: 8px; }
        table { border-collapse: collapse; width: 100%; margin: 15px 0; }
        th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
        th { background: #f5f5f5; }
    </style>
</head>
<body>
    <h1>历史数据与温湿度曲线</h1>
    <nav>
        <a href="/">首页</a>
        <a href="/history">历史数据与曲线</a>
    </nav>

    <h2>温湿度变化曲线（matplotlib 绘制）</h2>
    <img src="/static/images/env_chart.png" alt="温湿度变化曲线">

    <h2>最近记录（最近30条）</h2>
    <table>
        <tr><th>时间</th><th>温度(℃)</th><th>湿度(%)</th></tr>
        {% for r in records %}
        <tr>
            <td>{{ r['time'] }}</td>
            <td>{{ r['temp'] }}</td>
            <td>{{ r['humi'] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
